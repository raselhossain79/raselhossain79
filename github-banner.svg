<svg width="900" height="155" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="glow" x="-20%" y="-40%" width="140%" height="180%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softglow" x="-10%" y="-30%" width="120%" height="160%">
      <feGaussianBlur stdDeviation="1.8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="noise">
      <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feBlend in="SourceGraphic" mode="overlay" result="blend"/>
      <feComposite in="blend" in2="SourceGraphic" operator="in"/>
    </filter>
    <style>
      @keyframes blink {
        0%,49%{ opacity:1; }
        50%,100%{ opacity:0; }
      }
      @keyframes scan {
        0%   { transform: translateY(0px);   opacity: 0; }
        5%   { opacity: 0.07; }
        95%  { opacity: 0.07; }
        100% { transform: translateY(155px); opacity: 0; }
      }
      .cursor { animation: blink 1s step-end infinite; }
      .scanline { animation: scan 4s linear infinite; }
    </style>
  </defs>

  <!-- Base dark background -->
  <rect width="900" height="155" fill="#080d13"/>

  <!-- Subtle vignette from edges -->
  <rect width="900" height="155" fill="url(#vignette)" opacity="0.5"/>

  <!-- Very faint background binary - top left -->
  <text x="12" y="22" font-family="monospace" font-size="9" fill="#00FF41" opacity="0.04">10110100 01101101 10010011 01010110 11001010</text>
  <text x="12" y="34" font-family="monospace" font-size="9" fill="#00FF41" opacity="0.03">01001101 10110011 00101101 11010010 01101100</text>

  <!-- Very faint background binary - bottom right -->
  <text x="540" y="133" font-family="monospace" font-size="9" fill="#00FF41" opacity="0.04">11010110 00110101 10101100 01110011 10011011</text>
  <text x="540" y="145" font-family="monospace" font-size="9" fill="#00FF41" opacity="0.03">00101011 11001001 01010110 10011010 00110110</text>

  <!-- Animated scanline -->
  <rect class="scanline" width="900" height="2" fill="#00FF41" x="0" y="0"/>

  <!-- Top thin border line -->
  <line x1="0" y1="0" x2="900" y2="0" stroke="#00FF41" stroke-width="1.5" opacity="0.5"/>

  <!-- Bottom thin border line -->
  <line x1="0" y1="154" x2="900" y2="154" stroke="#00FF41" stroke-width="1.5" opacity="0.5"/>

  <!-- LEFT accent bar -->
  <rect x="0" y="0" width="3" height="155" fill="#00FF41" opacity="0.4"/>

  <!-- RIGHT accent bar -->
  <rect x="897" y="0" width="3" height="155" fill="#00FF41" opacity="0.4"/>

  <!-- ═══ Terminal line 1 ═══ -->
  <!-- ┌── -->
  <text x="220" y="65"
        font-family="'Courier New',Courier,monospace"
        font-size="18" fill="#00FF41"
        filter="url(#glow)" opacity="0.9">┌──(</text>

  <!-- raselhossain79 -->
  <text x="280" y="65"
        font-family="'Courier New',Courier,monospace"
        font-size="18" fill="#00FF41"
        font-weight="bold" filter="url(#glow)">raselhossain79</text>

  <!-- ㉿kali -->
  <text x="483" y="65"
        font-family="'Courier New',Courier,monospace"
        font-size="18" fill="#ffffff" opacity="0.7">㉿kali</text>

  <!-- )-[~/pentest] -->
  <text x="556" y="65"
        font-family="'Courier New',Courier,monospace"
        font-size="18" fill="#00FF41" opacity="0.85">)-[</text>
  <text x="584" y="65"
        font-family="'Courier New',Courier,monospace"
        font-size="18" fill="#5599ff" opacity="0.85">~/pentest</text>
  <text x="680" y="65"
        font-family="'Courier New',Courier,monospace"
        font-size="18" fill="#00FF41" opacity="0.85">]</text>

  <!-- ═══ Terminal line 2 ═══ -->
  <!-- └─$ -->
  <text x="220" y="97"
        font-family="'Courier New',Courier,monospace"
        font-size="18" fill="#00FF41"
        filter="url(#glow)" opacity="0.9">└─$ whoami</text>

  <!-- Output text -->
  <text x="355" y="97"
        font-family="'Courier New',Courier,monospace"
        font-size="14" fill="#aaaaaa" opacity="0.75">  ──  Penetration Tester · Bug Hunter · Security Researcher</text>

  <!-- ═══ Terminal line 3 - output ═══ -->
  <text x="220" y="124"
        font-family="'Courier New',Courier,monospace"
        font-size="13" fill="#5599ff" opacity="0.6">         web-app-security | osint | linux-hardening | ctf</text>

  <!-- Blinking cursor -->
  <rect class="cursor" x="220" y="130" width="9" height="16" fill="#00FF41" opacity="0.85"/>

</svg>